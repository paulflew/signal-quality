name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: dotnet build SignalQuality.csproj -c Release

      - name: Build the test harness
        run: dotnet build tests/Tests.csproj -c Release

      # Offline only: the live web checks depend on the runner's network and would make
      # CI flaky. Run tests\bin\Release\Tests.exe with no flag locally for those.
      - name: Run tests
        run: tests\bin\Release\Tests.exe --offline

      # The no-SDK path people get from a clean checkout on any Windows machine.
      - name: Build with the compiler that ships with Windows
        shell: cmd
        run: build.cmd

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Item bin/Release/SignalQuality.exe).VersionInfo.ProductVersion
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DSourceExe=$PWD\bin\Release\SignalQuality.exe" installer\SignalQuality.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test install and uninstall
        shell: pwsh
        run: installer\test-installer.ps1 -Setup (Get-Item installer\out\SignalQuality-Setup-*.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: SignalQuality
          path: |
            bin/Release/SignalQuality.exe
            installer/out/SignalQuality-Setup-*.exe
          if-no-files-found: error
